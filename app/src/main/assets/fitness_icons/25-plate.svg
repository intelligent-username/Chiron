<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 200 200">

  <!-- Larger black circle inside -->
  <circle cx="100" cy="100" r="95" fill="black"/>

  <!-- Outer circle with thinner white border (on top) -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="white" stroke-width="3"/>

  <!-- X lines, continuous but ending earlier before centre -->
  <line x1="105" y1="95" x2="145" y2="55" stroke="white" stroke-width="5"/> <!-- top-right -->
  <line x1="105" y1="105" x2="145" y2="145" stroke="white" stroke-width="5"/> <!-- bottom-right -->
  <line x1="95" y1="105" x2="55" y2="145" stroke="white" stroke-width="5"/> <!-- bottom-left -->
  <line x1="95" y1="95" x2="55" y2="55" stroke="white" stroke-width="5"/> <!-- top-left -->

  <!-- Centre circle: smaller than 45 -->
  <circle cx="100" cy="100" r="8" fill="none" stroke="white" stroke-width="5"/>

  <!-- Text "25" fully centred in the top half -->
  <text x="100" y="50" fill="white" font-size="20" font-family="Times New Roman" text-anchor="middle" alignment-baseline="middle">25</text>

  <!-- Upside-down text "25" in the bottom half -->
  <text x="100" y="50" fill="white" font-size="20" font-family="Times New Roman" text-anchor="middle" alignment-baseline="middle" transform="rotate(180 100 100)">25</text>
</svg>